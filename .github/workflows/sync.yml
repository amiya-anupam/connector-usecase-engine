name: Sync to IBM GHE

# Triggered on every push to github.com (main or dev)
# Mirrors the pushed branch to github.ibm.com automatically.
#
# Required secrets (github.com repo → Settings → Secrets → Actions):
#   IBM_GHE_PAT — PAT from github.ibm.com with repo scope
#                 Create at: https://github.ibm.com/settings/tokens

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  sync:
    name: Mirror to IBM GHE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to IBM GHE
        run: |
          git remote add ibm \
            "https://Amiya-Anupam1:${{ secrets.IBM_GHE_PAT }}@github.ibm.com/Amiya-Anupam1/connector-usecase-engine.git"
          git push ibm "${{ github.ref }}" --force-with-lease
